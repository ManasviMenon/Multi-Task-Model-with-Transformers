# Continuous integration: lint, test, and confirm the image builds and starts.
# Deployment is deliberately out of scope - nothing here pushes an image or touches a host.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  TF_CPP_MIN_LOG_LEVEL: "2"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        # A clean checkout has no mlruns/ (the model registry is gitignored), so the handful of
        # serving tests that need a registered model skip. -rs prints why, so a skip is never silent.
        run: pytest -q -rs

  docker:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Free disk space
        # The image is ~3 GB (TensorFlow), and the build needs the builder stage alongside it.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build
        # Without mlruns/ in the checkout this builds an image with no model baked in - see the Dockerfile.
        run: docker build -t mtl-var:ci .

      - name: Start the container and check /health
        run: |
          docker run -d --name mtl-var-ci -p 8000:8000 mtl-var:ci
          for i in $(seq 1 36); do
            if curl -fsS http://127.0.0.1:8000/health -o health.json; then break; fi
            sleep 5
          done
          test -s health.json || { echo "/health never responded"; exit 1; }
          cat health.json; echo
          # With no registry the service must start and say so, not crash: "degraded" is the expected
          # status here, and "ok" is what a build with a baked-in registry reports.
          python3 -c "import json, sys; s = json.load(open('health.json')).get('status'); print('status:', s); sys.exit(0 if s in ('ok', 'degraded') else 1)"

      - name: Container logs
        if: always()
        run: docker logs mtl-var-ci || true
